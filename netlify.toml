[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Set SITE_URL to your deployed domain to populate canonical URLs and the sitemap.
  # e.g. SITE_URL = "https://your-site.netlify.app"

# Redirect all unmatched routes to index.html for SPA client-side routing.
# NOTE: pre-rendered shrine pages (dist/shrine/<slug>/index.html) are served
# first — Netlify resolves specific files before this wildcard rewrite.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for every response. A full Content-Security-Policy is not
# set here — it needs an allowlist for CARTO/Esri/MapTiler tiles, Google
# Fonts/Maps, and the PWA service worker, and must be tested on a deploy.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Vite emits content-hashed filenames under /assets — cache them forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[dev]
  command = "npm run dev"
  port = 5173
  targetPort = 5173
