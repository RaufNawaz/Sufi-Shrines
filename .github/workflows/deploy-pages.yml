name: Deploy to GitHub Pages

# Triggers on the version branch Pages is meant to track. Update this list
# when cutting a new version branch (e.g. add '1.8' before retiring '1.7').
#
# 1.7 was cut 23 August 2026 and is the branch Pages tracks. 1.6 stays listed
# until Pages is confirmed pointing at 1.7 — a push trigger reads the workflow
# from the branch being pushed, so removing 1.6 here removes its only path to
# a deploy, and there would be nothing to fall back to if 1.7 has a problem.
on:
  push:
    branches: [1.7, 1.6]
  workflow_dispatch:

# Building only needs to read the repo; the deploy job requests its own
# pages/id-token write permissions below.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Gate the deploy on the same checks CI runs — a red push to the
      # version branch must not reach production. data:validate invokes
      # `python3 urdu-i18n/build_dictionary.py --check` (stdlib-only Python,
      # so the runner's system python3 suffices).
      - name: Verify (typecheck · lint · test · data)
        run: npm run typecheck && npm run lint && npm run test && npm run data:validate

      - name: Build
        run: npm run build
        env:
          SITE_URL: https://raufnawaz.github.io/Sufi-Shrines
          # Optional — omit the repo secrets below and the build silently
          # falls back to the free CARTO Voyager basemap (no signup needed).
          # Set both to switch the default basemap to the English-labels-forced
          # MapTiler style (see .env.example for how these are obtained).
          VITE_MAPTILER_KEY: ${{ secrets.VITE_MAPTILER_KEY }}
          VITE_MAPTILER_STYLE_ID: ${{ secrets.VITE_MAPTILER_STYLE_ID }}

      # The last gate before the site goes live, and the only one that can see
      # base-path bugs: every other job builds with the base at `/` (the e2e
      # artifact needs root-relative URLs), which is the one configuration in
      # which such bugs do not exist. Boots the *real* artifact at
      # /Sufi-Shrines/ behind a server that behaves like GitHub Pages — files
      # under the prefix, 404.html with a 404 status — and asserts every route
      # renders and every in-app link carries the base. See HANDOVER §9.58/§9.60
      # for the two production-only bugs that motivated it.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify the production base path
        run: npm run verify:pages

      # The team edition (scripts/team/, 31 October 2026): the same code built with the team gate
      # on, published under /Sufi-Shrines/team/ only as AES-GCM ciphertext and opened in the
      # browser with a shared passphrase. Built only when the TEAM_PASSPHRASE secret is set;
      # without it the deploy is the public site alone. The secret is passed only to the steps
      # that need it, and is never echoed (Actions also masks it in the log).
      - name: Check for the team passphrase
        id: team
        env:
          TEAM_PASSPHRASE: ${{ secrets.TEAM_PASSPHRASE }}
        run: |
          if [ -n "$TEAM_PASSPHRASE" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Team edition not built::The TEAM_PASSPHRASE secret is not set, so this deploy has no /team/ site."
          fi

      - name: Build the team edition
        if: steps.team.outputs.enabled == 'true'
        run: npm run build:team
        env:
          VITE_MAPTILER_KEY: ${{ secrets.VITE_MAPTILER_KEY }}
          VITE_MAPTILER_STYLE_ID: ${{ secrets.VITE_MAPTILER_STYLE_ID }}

      # Writes dist/team/, then runs scripts/check-public-bundle.mjs twice: it must find team
      # content in dist-team (the canary works) and none in dist/team (nothing readable leaked).
      - name: Encrypt the team edition into dist/team
        if: steps.team.outputs.enabled == 'true'
        run: npm run team:encrypt
        env:
          TEAM_PASSPHRASE: ${{ secrets.TEAM_PASSPHRASE }}
          # Optional (Rauf, 31 October 2026): a fixed salt keeps the team unlocked across deploys
          # until the passphrase changes. Make one with `openssl rand -base64 16`.
          TEAM_SALT: ${{ secrets.TEAM_SALT }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
