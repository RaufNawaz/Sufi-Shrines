name: Deploy to GitHub Pages

# Triggers on the version branch Pages is meant to track. Update this list
# when cutting a new version branch (e.g. add '1.7' before retiring '1.6').
on:
  push:
    branches: [1.6]
  workflow_dispatch:

# Building only needs to read the repo; the deploy job requests its own
# pages/id-token write permissions below.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Gate the deploy on the same checks CI runs — a red push to the
      # version branch must not reach production. data:validate invokes
      # `python3 urdu-i18n/build_dictionary.py --check` (stdlib-only Python,
      # so the runner's system python3 suffices).
      - name: Verify (typecheck · lint · test · data)
        run: npm run typecheck && npm run lint && npm run test && npm run data:validate

      - name: Build
        run: npm run build
        env:
          SITE_URL: https://raufnawaz.github.io/Sufi-Shrines

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
