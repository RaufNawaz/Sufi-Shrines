name: Deploy to GitHub Pages

# Triggers on the version branch Pages is meant to track. Update this list
# when cutting a new version branch (e.g. add '1.7' before retiring '1.6').
on:
  push:
    branches: [1.6]
  workflow_dispatch:

# Building only needs to read the repo; the deploy job requests its own
# pages/id-token write permissions below.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Gate the deploy on the same checks CI runs — a red push to the
      # version branch must not reach production. data:validate invokes
      # `python3 urdu-i18n/build_dictionary.py --check` (stdlib-only Python,
      # so the runner's system python3 suffices).
      - name: Verify (typecheck · lint · test · data)
        run: npm run typecheck && npm run lint && npm run test && npm run data:validate

      - name: Build
        run: npm run build
        env:
          SITE_URL: https://raufnawaz.github.io/Sufi-Shrines
          # Optional — omit the repo secrets below and the build silently
          # falls back to the free CARTO Voyager basemap (no signup needed).
          # Set both to switch the default basemap to the English-labels-forced
          # MapTiler style (see .env.example for how these are obtained).
          VITE_MAPTILER_KEY: ${{ secrets.VITE_MAPTILER_KEY }}
          VITE_MAPTILER_STYLE_ID: ${{ secrets.VITE_MAPTILER_STYLE_ID }}

      # The last gate before the site goes live, and the only one that can see
      # base-path bugs: every other job builds with the base at `/` (the e2e
      # artifact needs root-relative URLs), which is the one configuration in
      # which such bugs do not exist. Boots the *real* artifact at
      # /Sufi-Shrines/ behind a server that behaves like GitHub Pages — files
      # under the prefix, 404.html with a 404 status — and asserts every route
      # renders and every in-app link carries the base. See HANDOVER §9.58/§9.60
      # for the two production-only bugs that motivated it.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify the production base path
        run: npm run verify:pages

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
