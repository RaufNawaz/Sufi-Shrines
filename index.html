<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sufi Shrines Map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="wrap">
      <div id="map" aria-label="Map"></div>

      <aside id="sidebar" class="collapsed">
        <button
          id="sidebarToggle"
          class="sidebar-toggle"
          type="button"
          aria-label="Toggle sidebar"
        >
          <span class="icon" aria-hidden="true"></span>
        </button>

        <div class="sidebar-inner">
          <div class="sidebar-header">
            <h1 id="mapTitle">Sufi Shrines</h1>
            <button id="languageToggle" class="language-toggle" type="button">
              اردو
            </button>
          </div>
          <div id="status" class="status">Loading...</div>
          <div id="details" class="details">
            <p class="muted">
              No shrine selected yet. Click a marker to view details.
            </p>
          </div>
        </div>
      </aside>
    </div>

    <script src="./editor-config.js"></script>
    <script src="./data-source.js"></script>
    <script src="./translations.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
