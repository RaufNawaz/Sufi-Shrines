<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a5c4e" />
    <meta
      name="description"
      content="An interactive map of Sufi shrines across Pakistan. Explore histories, architecture, rituals, and visitor information in English and Urdu."
    />
    <meta property="og:title" content="Sufi Shrines of Pakistan" />
    <meta
      property="og:description"
      content="Explore Sufi shrine histories, architecture, rituals, and visitor information across Pakistan in English and Urdu."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Language variants — same URL, content swaps client-side via ?lang=;
         prerender.mjs rewrites these to absolute URLs (with SITE_URL) on
         every generated page, including this file, during `npm run build`. -->
    <link rel="alternate" hreflang="en" href="/" />
    <link rel="alternate" hreflang="ur" href="/?lang=ur" />
    <link rel="alternate" hreflang="x-default" href="/" />

    <!-- iOS PWA home-screen support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sufi Shrines" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Fonts: linked here (not @import) so the fetch starts before the app CSS arrives.
         Noto Nastaliq Urdu is self-hosted (see src/styles/global.css) — the
         primary Urdu reading face doesn't depend on this CDN being reachable. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap"
    />
    <link
      rel="preload"
      href="/fonts/NotoNastaliqUrdu-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      // Headings render at font-weight 700 (.shrine-title, h1-h4, etc.) — on
      // a cold Urdu load, only preloading the 400 weight above means the 700
      // face arrives late (synthetic-bold flash, then a swap). Preloading it
      // unconditionally would cost every English-first visitor ~154KB they
      // don't need, so only do it when this same-priority-order check (see
      // detectInitialLang() in LanguageContext.tsx) resolves to Urdu.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var lang = params.get('lang');
        // A /ur/* prerendered route (urlLangPrefix.ts) is as explicit a
        // signal as ?lang=ur — same priority tier in detectInitialLang().
        if (lang !== 'en' && lang !== 'ur' && /(^|\/)ur(\/|$)/.test(window.location.pathname)) {
          lang = 'ur';
        }
        if (lang !== 'en' && lang !== 'ur') {
          lang = localStorage.getItem('shrines_language');
        }
        if (lang !== 'en' && lang !== 'ur') {
          lang =
            navigator.language && navigator.language.toLowerCase().indexOf('ur') === 0
              ? 'ur'
              : 'en';
        }
        if (lang === 'ur') {
          var link = document.createElement('link');
          link.rel = 'preload';
          link.href = '/fonts/NotoNastaliqUrdu-700.woff2';
          link.as = 'font';
          link.type = 'font/woff2';
          link.crossOrigin = 'anonymous';
          document.head.appendChild(link);
        }
      })();
    </script>

    <!-- Map tiles: warm the CDN connection before Leaflet's first request -->
    <link rel="preconnect" href="https://a.basemaps.cartocdn.com" />
    <link rel="dns-prefetch" href="https://b.basemaps.cartocdn.com" />
    <link rel="dns-prefetch" href="https://c.basemaps.cartocdn.com" />
    <link rel="dns-prefetch" href="https://d.basemaps.cartocdn.com" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Sufi Shrines of Pakistan</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
